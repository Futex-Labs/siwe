[package]
name = "siwe"
version = "0.1.0"
authors = ["Futex Labs <opensource@futexlabs.io>"]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Rust implementation of EIP-4361: Sign In With Ethereum"
repository = "https://github.com/Futex-Labs/siwe"
exclude = ["tests", ".github"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
iri-string = "0.7"
hex = "0.4"
k256 = { version = "0.13", default-features = false, features = [
    "std",
    "ecdsa",
] }
sha3 = "0.11"
time = { version = "0.3", features = ["parsing", "formatting"] }
thiserror = "2.0.18"
http = "1.4.0"
rand = "0.10.1"
serde = { version = "1.0.228", optional = true }
typed-builder = { version = "0.23.0", optional = true }
alloy = { version = "2.0", optional = true, features = ["providers", "sol-types", "contract"]}
sstr = "0.3.0"

[dev-dependencies]
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.52", features = ["rt", "macros", "rt-multi-thread"] }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
all-features = true
